services:
  - type: web
    name: silogtran-log-interfaz
    # Docker: el login necesita Chromium (Playwright) y sus librerias de sistema.
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: API_TOKEN
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SILOGTRAN_USERNAME
        sync: false
      - key: SILOGTRAN_PASSWORD
        sync: false
      - key: TARGET_API_KEY
        sync: false
